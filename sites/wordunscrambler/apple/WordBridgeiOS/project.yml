name: WordBridgeiOS

options:
  bundleIdPrefix: com.boringsites
  deploymentTarget:
    iOS: "17.0"
    macOS: "14.0"
    watchOS: "10.0"
    tvOS: "17.0"
    visionOS: "1.0"

packages:
  WordBridgeApp:
    path: ../WordBridgeApp

targets:
  WordBridgeiOS:
    type: application
    platform: iOS
    sources:
      - Sources
      - Resources
    dependencies:
      - package: WordBridgeApp
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.boringsites.wordbridge
        PRODUCT_NAME: WordBridge
        MARKETING_VERSION: 1.0
        CURRENT_PROJECT_VERSION: 1
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: WordBridge
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.word-games
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTS_MACCATALYST: NO
      configs:
        Debug:
          CODE_SIGNING_ALLOWED: NO
        Release:
          CODE_SIGNING_STYLE: Automatic
          DEVELOPMENT_TEAM: 97ZA7QV77G

  WordBridgeMac:
    type: application
    platform: macOS
    sources:
      - SourcesMac
    dependencies:
      - package: WordBridgeApp
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.boringsites.wordbridge.mac
        PRODUCT_NAME: WordBridge
        MARKETING_VERSION: 1.0
        CURRENT_PROJECT_VERSION: 1
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: WordBridge
        CODE_SIGNING_ALLOWED: NO

  WordBridgeWatch:
    type: application
    platform: watchOS
    sources:
      - SourcesWatch
    dependencies:
      - package: WordBridgeApp
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.boringsites.wordbridge.watch
        PRODUCT_NAME: WordBridge
        MARKETING_VERSION: 1.0
        CURRENT_PROJECT_VERSION: 1
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: WordBridge
        CODE_SIGNING_ALLOWED: NO

  WordBridgeTV:
    type: application
    platform: tvOS
    sources:
      - SourcesTV
    dependencies:
      - package: WordBridgeApp
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.boringsites.wordbridge.tv
        PRODUCT_NAME: WordBridge
        MARKETING_VERSION: 1.0
        CURRENT_PROJECT_VERSION: 1
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: WordBridge
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        CODE_SIGNING_ALLOWED: NO

  WordBridgeVision:
    type: application
    platform: visionOS
    sources:
      - SourcesVision
    dependencies:
      - package: WordBridgeApp
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.boringsites.wordbridge.vision
        PRODUCT_NAME: WordBridge
        MARKETING_VERSION: 1.0
        CURRENT_PROJECT_VERSION: 1
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: WordBridge
        CODE_SIGNING_ALLOWED: NO
