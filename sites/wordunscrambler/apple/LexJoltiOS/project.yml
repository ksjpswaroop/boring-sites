name: LexJoltiOS

options:
  bundleIdPrefix: com.lexjolt
  deploymentTarget:
    iOS: "17.0"
    macOS: "14.0"
    watchOS: "10.0"
    tvOS: "17.0"
    visionOS: "1.0"

packages:
  LexJoltApp:
    path: ../LexJoltApp

targets:
  LexJoltiOS:
    type: application
    platform: iOS
    sources:
      - Sources
      - Resources
    dependencies:
      - package: LexJoltApp
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.lexjolt.app
        PRODUCT_NAME: LexJolt
        MARKETING_VERSION: 1.0
        CURRENT_PROJECT_VERSION: 1
        GENERATE_INFOPLIST_FILE: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        INFOPLIST_KEY_CFBundleDisplayName: LexJolt
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.word-games
        INFOPLIST_KEY_UILaunchStoryboardName: LaunchScreen
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTS_MACCATALYST: NO
      configs:
        Debug:
          CODE_SIGNING_ALLOWED: NO
        Release:
          CODE_SIGNING_STYLE: Automatic
          DEVELOPMENT_TEAM: 97ZA7QV77G

  LexJoltMac:
    type: application
    platform: macOS
    sources:
      - SourcesMac
      - ResourcesMac
    dependencies:
      - package: LexJoltApp
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.lexjolt.app.mac
        PRODUCT_NAME: LexJolt
        MARKETING_VERSION: 1.0
        CURRENT_PROJECT_VERSION: 1
        GENERATE_INFOPLIST_FILE: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_ENTITLEMENTS: Config/LexJoltMac.entitlements
        INFOPLIST_KEY_CFBundleDisplayName: LexJolt
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.word-games
      configs:
        Debug:
          CODE_SIGNING_ALLOWED: NO
        Release:
          CODE_SIGNING_STYLE: Automatic
          DEVELOPMENT_TEAM: 97ZA7QV77G

  LexJoltWatch:
    type: application
    platform: watchOS
    sources:
      - SourcesWatch
      - ResourcesWatch
      - path: Resources/PrivacyInfo.xcprivacy
    dependencies:
      - package: LexJoltApp
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.lexjolt.app.watch
        PRODUCT_NAME: LexJolt
        MARKETING_VERSION: 1.0
        CURRENT_PROJECT_VERSION: 1
        GENERATE_INFOPLIST_FILE: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        INFOPLIST_KEY_CFBundleDisplayName: LexJolt
        INFOPLIST_KEY_WKWatchOnly: YES
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.word-games
      configs:
        Debug:
          CODE_SIGNING_ALLOWED: NO
        Release:
          CODE_SIGNING_STYLE: Automatic
          DEVELOPMENT_TEAM: 97ZA7QV77G

  LexJoltTV:
    type: application
    platform: tvOS
    sources:
      - SourcesTV
      - ResourcesTV
      - path: Resources/PrivacyInfo.xcprivacy
    dependencies:
      - package: LexJoltApp
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.lexjolt.app.tv
        PRODUCT_NAME: LexJolt
        MARKETING_VERSION: 1.0
        CURRENT_PROJECT_VERSION: 1
        GENERATE_INFOPLIST_FILE: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        INFOPLIST_KEY_CFBundleDisplayName: LexJolt
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.word-games
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
      configs:
        Debug:
          CODE_SIGNING_ALLOWED: NO
        Release:
          CODE_SIGNING_STYLE: Automatic
          DEVELOPMENT_TEAM: 97ZA7QV77G

  LexJoltVision:
    type: application
    platform: visionOS
    sources:
      - SourcesVision
      - ResourcesVision
      - path: Resources/PrivacyInfo.xcprivacy
    dependencies:
      - package: LexJoltApp
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.lexjolt.app.vision
        PRODUCT_NAME: LexJolt
        MARKETING_VERSION: 1.0
        CURRENT_PROJECT_VERSION: 1
        GENERATE_INFOPLIST_FILE: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        INFOPLIST_KEY_CFBundleDisplayName: LexJolt
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.word-games
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
      configs:
        Debug:
          CODE_SIGNING_ALLOWED: NO
        Release:
          CODE_SIGNING_STYLE: Automatic
          DEVELOPMENT_TEAM: 97ZA7QV77G
